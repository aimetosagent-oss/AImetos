<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Te ROI automatitzar-ho?</title>
  <desc id="desc">Visual per LinkedIn amb tres criteris: volum, variabilitat i seguiment.</desc>
  <rect width="1200" height="627" fill="#f4f6f8"/>
  <rect x="56" y="54" width="1088" height="519" rx="18" fill="#ffffff" stroke="#d9e0e7" stroke-width="3"/>
  <text x="94" y="132" fill="#0f766e" font-family="Arial, sans-serif" font-size="26" font-weight="700">AImetos</text>
  <text x="94" y="222" fill="#172026" font-family="Arial, sans-serif" font-size="58" font-weight="800">Te ROI automatitzar-ho?</text>
  <text x="96" y="278" fill="#64717f" font-family="Arial, sans-serif" font-size="28">Abans de construir un agent de veu, valida aquests 3 criteris.</text>
  <g transform="translate(94 352)">
    <rect width="300" height="142" rx="14" fill="#e4f3f1"/>
    <text x="28" y="56" fill="#075f58" font-family="Arial, sans-serif" font-size="30" font-weight="800">1. Volum</text>
    <text x="28" y="96" fill="#172026" font-family="Arial, sans-serif" font-size="22">Hi ha prou repeticio?</text>
  </g>
  <g transform="translate(450 352)">
    <rect width="300" height="142" rx="14" fill="#e8eefc"/>
    <text x="28" y="56" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="30" font-weight="800">2. Variabilitat</text>
    <text x="28" y="96" fill="#172026" font-family="Arial, sans-serif" font-size="22">Es pot controlar el cas?</text>
  </g>
  <g transform="translate(806 352)">
    <rect width="300" height="142" rx="14" fill="#fff4df"/>
    <text x="28" y="56" fill="#8a4b00" font-family="Arial, sans-serif" font-size="30" font-weight="800">3. Seguiment</text>
    <text x="28" y="96" fill="#172026" font-family="Arial, sans-serif" font-size="22">Es mesura l'impacte?</text>
  </g>
  <text x="94" y="540" fill="#64717f" font-family="Arial, sans-serif" font-size="22">Post recomanat: IA, transformacio digital i PIMEs</text>
</svg>
