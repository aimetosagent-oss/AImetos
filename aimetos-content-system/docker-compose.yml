services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimetos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aimetos}
      POSTGRES_DB: ${POSTGRES_DB:-aimetos_content}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimetos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "4317:4317"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4317/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./automation/n8n:/workflows:ro
    ports:
      - "5678:5678"
    restart: unless-stopped
volumes:
  postgres-data:
  n8n-data:
networks:
  default:
    name: aimetos-content-system
